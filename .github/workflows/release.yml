name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Project version from pyproject.toml, for example 0.2.0"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve release metadata
        id: release_meta
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          pyproject = pathlib.Path("pyproject.toml")
          data = tomllib.loads(pyproject.read_text(encoding="utf-8"))
          version = data["project"]["version"]
          event_name = os.environ["GITHUB_EVENT_NAME"]
          actual_tag = os.environ.get("GITHUB_REF_NAME", "")
          requested_version = os.environ.get("INPUT_VERSION", "").strip()

          if event_name == "workflow_dispatch":
              if requested_version != version:
                  raise SystemExit(
                      f"Manual release version {requested_version!r} does not match project version {version!r}."
                  )
              release_tag = f"v{version}"
          else:
              expected_tag = f"v{version}"
              if actual_tag != expected_tag:
                  raise SystemExit(f"Tag {actual_tag!r} does not match project version {expected_tag!r}.")
              release_tag = actual_tag

          prerelease = bool(re.search(r"[A-Za-z]", version))
          github_output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as handle:
              handle.write(f"version={version}\n")
              handle.write(f"tag={release_tag}\n")
              handle.write(f"prerelease={'true' if prerelease else 'false'}\n")
          PY

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . build twine

      - name: Run CLI smoke tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build distribution artifacts
        run: python -m build

      - name: Validate package metadata
        run: |
          python -m twine check \
            dist/always_attend-${{ steps.release_meta.outputs.version }}.tar.gz \
            dist/always_attend-${{ steps.release_meta.outputs.version }}-*.whl

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.release_meta.outputs.prerelease == 'true' }}
          files: |
            dist/always_attend-${{ steps.release_meta.outputs.version }}.tar.gz
            dist/always_attend-${{ steps.release_meta.outputs.version }}-*.whl
          body_path: release/release-notes.md

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: |
            dist/always_attend-${{ steps.release_meta.outputs.version }}.tar.gz
            dist/always_attend-${{ steps.release_meta.outputs.version }}-*.whl

  publish-pypi:
    needs: build-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/always-attend
    permissions:
      id-token: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
